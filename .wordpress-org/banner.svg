<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1544 500" width="1544" height="500" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1033"/><stop offset="0.55" stop-color="#1e1b4b"/><stop offset="1" stop-color="#0b3b3a"/></linearGradient>
		<radialGradient id="glowA" cx="0.12" cy="0.2" r="0.55"><stop offset="0" stop-color="#6366f1" stop-opacity="0.45"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
		<radialGradient id="glowB" cx="0.8" cy="0.5" r="0.5"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0.26"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
		<pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/></pattern>
		<filter id="ishadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/></filter>
		<filter id="cshadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/></filter>
	</defs>
	<rect width="1544" height="500" fill="url(#bg)"/>
	<rect width="1544" height="500" fill="url(#grid)"/>
	<rect width="1544" height="500" fill="url(#glowA)"/>
	<rect width="1544" height="500" fill="url(#glowB)"/>

	<!-- icon: same artwork as icon.svg -->
	<g transform="translate(110 58) scale(0.52)" filter="url(#ishadow)">
		<defs>
			<linearGradient id="bbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b50f0"/><stop offset="0.5" stop-color="#4338ca"/><stop offset="1" stop-color="#0f8f86"/></linearGradient>
			<radialGradient id="bshine" cx="0.25" cy="0.1" r="0.9"><stop offset="0" stop-color="#ffffff" stop-opacity="0.3"/><stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
			<mask id="bmf" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256"><rect width="256" height="256" fill="#fff"/><g transform="rotate(-20 128 138)"><path d="M225.7 150.3A104 36 0 0 1 33.7 153.2" fill="none" stroke="#000" stroke-width="29" stroke-linecap="round"/></g></mask>
			<mask id="bmb" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256"><rect width="256" height="256" fill="#fff"/><path d="M128 40 204 214H52Z" fill="#000" stroke="#000" stroke-width="16" stroke-linejoin="round"/></mask>
		</defs>
		<rect width="256" height="256" rx="58" fill="url(#bbg)"/>
		<rect width="256" height="256" rx="58" fill="url(#bshine)"/>
		<rect x="1.5" y="1.5" width="253" height="253" rx="56.5" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="3"/>
		<!-- far half of the orbit: behind the A -->
		<g transform="rotate(-20 128 138)" mask="url(#bmb)">
			<path d="M30.3 125.7A104 36 0 0 1 222.3 122.8" fill="none" stroke="#99f6e4" stroke-width="15" stroke-linecap="round"/>
			<path d="M231.2 110.8 213.4 134.8 241.6 137.1Z" fill="#99f6e4" stroke="#99f6e4" stroke-width="6" stroke-linejoin="round"/>
		</g>
		<!-- A -->
		<path mask="url(#bmf)" fill="#ffffff" fill-rule="evenodd" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" d="M128 40 204 214H170L156 182H100L86 214H52ZM128 108 145 152H111Z"/>
		<!-- near half of the orbit: in front of the A -->
		<g transform="rotate(-20 128 138)">
			<path d="M225.7 150.3A104 36 0 0 1 33.7 153.2" fill="none" stroke="#5eead4" stroke-width="15" stroke-linecap="round"/>
			<path d="M42.6 141.2 24.8 165.2 14.4 138.9Z" fill="#5eead4" stroke="#5eead4" stroke-width="6" stroke-linejoin="round"/>
		</g>
	</g>

	<!-- free badge -->
	<g transform="translate(272 100)">
		<rect width="372" height="50" rx="25" fill="#5eead4"/>
		<circle cx="28" cy="25" r="12" fill="#0f1033"/>
		<path d="M22 25.5 26.3 29.8 34.5 21" fill="none" stroke="#5eead4" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
		<text x="50" y="33" font-size="21" font-weight="800" fill="#0f1033" letter-spacing="0.6" textLength="300" lengthAdjust="spacingAndGlyphs">100% FREE · OPEN SOURCE</text>
	</g>

	<text x="106" y="296" font-size="94" font-weight="700" fill="#ffffff" letter-spacing="-2.5">Avesta Sync</text>
	<text x="111" y="344" font-size="28" fill="#c7d2fe">Push and pull only what changed</text>
	<text x="111" y="380" font-size="28" fill="#c7d2fe">between two WordPress sites.</text>

	<g font-size="18" font-weight="600" fill="#e0e7ff">
		<g transform="translate(111 410)"><rect width="126" height="38" rx="19" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.16"/><text x="63" y="25" text-anchor="middle">Themes</text></g>
		<g transform="translate(249 410)"><rect width="126" height="38" rx="19" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.16"/><text x="63" y="25" text-anchor="middle">Plugins</text></g>
		<g transform="translate(387 410)"><rect width="126" height="38" rx="19" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.16"/><text x="63" y="25" text-anchor="middle">Content</text></g>
		<g transform="translate(525 410)"><rect width="126" height="38" rx="19" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.16"/><text x="63" y="25" text-anchor="middle">Media</text></g>
	</g>

	<!-- local card -->
	<g transform="translate(900 96)" filter="url(#cshadow)">
		<rect width="236" height="308" rx="18" fill="#ffffff"/>
		<rect width="236" height="54" rx="18" fill="#eef2ff"/><rect y="36" width="236" height="18" fill="#eef2ff"/>
		<circle cx="26" cy="27" r="6" fill="#4338ca"/>
		<text x="42" y="34" font-size="19" font-weight="700" fill="#312e81">Local</text>
		<g transform="translate(22 78)">
			<rect width="118" height="12" rx="6" fill="#c7d2fe"/><rect x="150" width="42" height="12" rx="6" fill="#4338ca"/>
			<rect y="40" width="150" height="12" rx="6" fill="#e5e7eb"/>
			<rect y="80" width="96" height="12" rx="6" fill="#c7d2fe"/><rect x="150" y="80" width="42" height="12" rx="6" fill="#4338ca"/>
			<rect y="120" width="132" height="12" rx="6" fill="#e5e7eb"/>
			<rect y="160" width="110" height="12" rx="6" fill="#e5e7eb"/>
			<rect y="200" width="140" height="12" rx="6" fill="#e5e7eb"/>
		</g>
	</g>
	<g fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
		<path d="M1158 214H1218M1202 198 1218 214 1202 230" stroke="#ffffff"/>
		<path d="M1222 286H1162M1178 270 1162 286 1178 302" stroke="#5eead4"/>
	</g>
	<!-- remote card -->
	<g transform="translate(1244 96)" filter="url(#cshadow)">
		<rect width="236" height="308" rx="18" fill="#ffffff"/>
		<rect width="236" height="54" rx="18" fill="#ccfbf1"/><rect y="36" width="236" height="18" fill="#ccfbf1"/>
		<circle cx="26" cy="27" r="6" fill="#0d9488"/>
		<text x="42" y="34" font-size="19" font-weight="700" fill="#134e4a">Production</text>
		<g transform="translate(22 78)">
			<rect width="118" height="12" rx="6" fill="#e5e7eb"/>
			<rect y="40" width="150" height="12" rx="6" fill="#99f6e4"/><rect x="160" y="40" width="32" height="12" rx="6" fill="#0d9488"/>
			<rect y="80" width="96" height="12" rx="6" fill="#e5e7eb"/>
			<rect y="120" width="132" height="12" rx="6" fill="#e5e7eb"/>
			<rect y="160" width="110" height="12" rx="6" fill="#99f6e4"/><rect x="160" y="160" width="32" height="12" rx="6" fill="#0d9488"/>
			<rect y="200" width="140" height="12" rx="6" fill="#e5e7eb"/>
		</g>
	</g>
</svg>
